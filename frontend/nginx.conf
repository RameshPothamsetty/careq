# Day 11 — Nginx runtime config for the CareQ frontend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Profile-picture uploads (user-service allows up to 5 MB per file) need a
    # larger body limit than Nginx's default 1 MB.
    client_max_body_size 10m;

    # Reverse-proxy all API traffic to the api-gateway container. The frontend
    # bundle calls relative /api/... paths, so no gateway URL is hardcoded.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Real-time notification socket — WebSocket upgrade proxied to the gateway.
    location /ws {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Client-side React Router fallback: unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html is never cached so new
    # builds propagate immediately.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.html;
    }
}
