server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    # Docker sets MYSQL_HOST=mysql; local dev falls back to localhost.
    # MYSQL_CONN_PARAMS is overridden by the CD pipeline to
    # sslMode=REQUIRED... so Azure talks TLS to the DB. Local default stays
    # plain (fast, zero-config docker-compose).
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/careq_db?${MYSQL_CONN_PARAMS:useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  mail:
    # Gmail SMTP via spring-boot-starter-mail. Credentials are optional:
    # when empty, EmailService fails open and skips the email step.
    host: ${APP_MAIL_HOST:smtp.gmail.com}
    port: ${APP_MAIL_PORT:587}
    username: ${APP_MAIL_USERNAME:}
    password: ${APP_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      # Docker sets EUREKA_URI=http://eureka-server:8761/eureka/
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:CareQTempSecretKeyForDevelopmentOnlyChangeInProduction2024}
    expiration-ms: 3600000
  auth:
    # Email verification. OFF by default so local docker-compose
    # keeps behaving like before (signup returns a JWT, scripts stay green).
    # The CD workflow sets it ON for Azure and wires the Gmail SMTP
    # credentials (both-or-neither).
    email-verification-enabled: ${AUTH_EMAIL_VERIFICATION_ENABLED:false}
  mail:
    # Gmail SMTP account used to send verification/reset emails. Blank in
    # local dev (docker-compose) → EmailService fails open and skips the
    # email step (accounts stay unverified, resend is available).
    username: ${APP_MAIL_USERNAME:}
    password: ${APP_MAIL_PASSWORD:}
    from: ${APP_MAIL_FROM:careq@example.com}
  frontend:
    # Base URL used to build the verify/reset links in emails.
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3030}
  rate-limit:
    # Brute-force / abuse protection on the public auth endpoints.
    login-max: ${AUTH_RATE_LIMIT_LOGIN_MAX:5}
    login-window-minutes: ${AUTH_RATE_LIMIT_LOGIN_WINDOW_MINUTES:15}
    signup-max: ${AUTH_RATE_LIMIT_SIGNUP_MAX:10}
    signup-window-minutes: ${AUTH_RATE_LIMIT_SIGNUP_WINDOW_MINUTES:60}
    email-max: ${AUTH_RATE_LIMIT_EMAIL_MAX:3}
    email-window-minutes: ${AUTH_RATE_LIMIT_EMAIL_WINDOW_MINUTES:60}

management:
  health:
    # Mail is optional (fail-open): with spring-boot-starter-mail on the
    # classpath Spring Boot auto-registers a MailHealthIndicator that does
    # a real SMTP connect. With blank local-docker credentials that AUTH
    # fails and /actuator/health reports DOWN forever, which would block
    # the CD smoke health check. The app's health must not depend on mail.
    mail:
      enabled: false

springdoc:
  api-docs:
    # Swagger/OpenAPI is gated by SPRINGDOC_ENABLED so production
    # deploys can switch it off (the CD workflow sets it to false).
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
