server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Day 17 — security response headers on every proxied route (defense in
      # depth on top of the Vercel/nginx frontend headers).
      default-filters:
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=Referrer-Policy, strict-origin-when-cross-origin
        - AddResponseHeader=Permissions-Policy, geolocation=(), camera=(), microphone=()
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: doctor-service
          uri: lb://doctor-service
          predicates:
            - Path=/api/doctors/**,/api/departments/**

        - id: queue-service
          uri: lb://queue-service
          predicates:
            - Path=/api/queue/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        # ── Day 9: OpenAPI aggregation routes ───────────────────────
        # Each downstream service's /v3/api-docs is exposed through the
        # gateway as /v3/api-docs/{service}, so one Swagger UI at
        # http://localhost:8080/swagger-ui.html can browse every service.
        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /v3/api-docs

        - id: doctor-service-docs
          uri: lb://doctor-service
          predicates:
            - Path=/v3/api-docs/doctor-service
          filters:
            - RewritePath=/v3/api-docs/doctor-service, /v3/api-docs

        - id: queue-service-docs
          uri: lb://queue-service
          predicates:
            - Path=/v3/api-docs/queue-service
          filters:
            - RewritePath=/v3/api-docs/queue-service, /v3/api-docs

        - id: notification-service-docs
          uri: lb://notification-service
          predicates:
            - Path=/v3/api-docs/notification-service
          filters:
            - RewritePath=/v3/api-docs/notification-service, /v3/api-docs

eureka:
  client:
    service-url:
      # Docker sets EUREKA_URI=http://eureka-server:8761/eureka/
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# ── Day 9: centralized Swagger UI ─────────────────────────────────
# One browsable UI listing every business service's OpenAPI docs.
# Day 17: SPRINGDOC_ENABLED=false (set by the CD workflow in production)
# switches BOTH the aggregated docs and the UI off entirely.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    urls:
      - name: Auth Service
        url: /v3/api-docs/auth-service
      - name: User Service
        url: /v3/api-docs/user-service
      - name: Doctor Service
        url: /v3/api-docs/doctor-service
      - name: Queue Service
        url: /v3/api-docs/queue-service
      - name: Notification Service
        url: /v3/api-docs/notification-service

app:
  jwt:
    secret: ${JWT_SECRET:CareQTempSecretKeyForDevelopmentOnlyChangeInProduction2024}
  cors:
    # Day 15 fix: Spring relaxed binding maps the CORS_ALLOWED_ORIGINS env var
    # to `cors.allowed-origins` (no `app.` prefix), so the @Value in CorsConfig
    # reading ${app.cors.allowed-origins} silently fell back to the localhost
    # defaults on Azure — the Vercel origin was rejected with a 403 preflight
    # and every browser call failed. Mapping it here makes the env var actually
    # reach the property.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3030,http://localhost:5173}
