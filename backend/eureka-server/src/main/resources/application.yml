server:
  port: 8761

eureka:
  instance:
    # Docker sets EUREKA_HOSTNAME=eureka-server so the dashboard links resolve.
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

spring:
  application:
    name: eureka-server
