server:
  port: 8084

spring:
  application:
    name: queue-service
  datasource:
    # Docker sets MYSQL_HOST=mysql; local dev falls back to localhost.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/careq_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      # Docker sets EUREKA_URI=http://eureka-server:8761/eureka/
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# ─────────────────────────────────────────────────────────────
# AI Symptom Triage — Groq (OpenAI-compatible chat completions)
# The API key is read strictly from the GROQ_API_KEY environment
# variable. If it is missing, AiTriageService falls back to
# NORMAL so a patient can always join the queue.
# ─────────────────────────────────────────────────────────────
ai:
  groq:
    api-key: ${GROQ_API_KEY:}
    url: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.1-8b-instant
    timeout-seconds: 5

# ─────────────────────────────────────────────────────────────
# Queue configuration
# delay-threshold-minutes: a WAITING patient is considered
# "delayed" in the Admin live overview when their predicted
# wait exceeds this value.
# ─────────────────────────────────────────────────────────────
queue:
  delay-threshold-minutes: 30
  max-doctors-to-load: 1000
