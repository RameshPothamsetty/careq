server:
  port: 8083

spring:
  application:
    name: doctor-service
  datasource:
    # Docker sets MYSQL_HOST=mysql; local dev falls back to localhost.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/careq_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  # Day 13: Redis caching for the doctor/department catalog (60s TTL).
  # Live queue data (position, wait time, availability) is deliberately NOT
  # cached — see docs/03_ARCHITECTURE.md. Docker sets REDIS_HOST=redis.
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      # Docker sets EUREKA_URI=http://eureka-server:8761/eureka/
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Pagination bounds for GET /api/doctors (Day 7a).
# 1000 keeps the Admin queue-overview's Feign fetch (size=1000) from being
# silently truncated while still bounding abusive client requests.
doctor-list:
  max-page-size: 1000
