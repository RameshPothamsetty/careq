server:
  port: 8083

spring:
  application:
    name: doctor-service
  datasource:
    url: jdbc:mysql://localhost:3306/careq_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Pagination bounds for GET /api/doctors (Day 7a).
# 1000 keeps the Admin queue-overview's Feign fetch (size=1000) from being
# silently truncated while still bounding abusive client requests.
doctor-list:
  max-page-size: 1000
