server:
  port: 8082

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  application:
    name: user-service
  datasource:
    # Docker sets MYSQL_HOST=mysql; local dev falls back to localhost.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/careq_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  upload:
    profile-pictures-dir: uploads/profile-pictures

# Pagination bound for the admin user list (GET /api/users, Day 7a)
user-list:
  max-page-size: 100

eureka:
  client:
    service-url:
      # Docker sets EUREKA_URI=http://eureka-server:8761/eureka/
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
