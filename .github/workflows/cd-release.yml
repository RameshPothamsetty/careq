# CareQ — CD: release images (Day 14)
#
# Runs on pushes to `main` and on version tags (`v*`, e.g. v0.2):
#   - Same test gate as CI/CD
#   - Build + push every image to ghcr.io/<owner>/careq-<service>
#     tagged with the release version (tag name, or `main` for plain
#     branch pushes) plus `latest`
#   - Full-stack smoke against the pushed images (pulled from GHCR)
#
# This is the pipeline Day 15's cloud deployment hooks into: a `deploy`
# job would be added here, after `build-and-push`, that pulls the
# `latest`/version images and rolls them out on the chosen platform.
name: CD · release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - auth-service
          - user-service
          - doctor-service
          - queue-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn -B --no-transfer-progress -f backend/pom.xml -pl ${{ matrix.service }} -am test

  frontend-tests:
    name: Frontend · typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + unit tests
        run: npm test
      - name: Production build
        run: npm run build

  build-and-push:
    name: Build & push · ${{ matrix.name }}
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eureka-server
            context: backend
            file: backend/eureka-server/Dockerfile
          - name: api-gateway
            context: backend
            file: backend/api-gateway/Dockerfile
          - name: auth-service
            context: backend
            file: backend/auth-service/Dockerfile
          - name: user-service
            context: backend
            file: backend/user-service/Dockerfile
          - name: doctor-service
            context: backend
            file: backend/doctor-service/Dockerfile
          - name: queue-service
            context: backend
            file: backend/queue-service/Dockerfile
          - name: notification-service
            context: backend
            file: backend/notification-service/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Release tag name when pushed as a tag, otherwise `main`.
      - name: Compute release version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=main" >> "$GITHUB_ENV"
          fi
          echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/careq-${{ matrix.name }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.GHCR_OWNER }}/careq-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha, mode=max

  # ── Smoke the exact pushed images inside the runner ────────────────
  docker-smoke:
    name: Docker · full-stack health check (pushed images)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute release version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=main" >> "$GITHUB_ENV"
          fi
          echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the full stack from pushed images
        run: |
          GHCR_OWNER="${{ env.GHCR_OWNER }}" CAREQ_IMAGE_TAG="${{ env.IMAGE_TAG }}" \
            docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      - name: Wait for every container to be healthy
        run: |
          set -e
          containers="careq-eureka careq-gateway careq-auth careq-user careq-doctor careq-queue careq-notification careq-frontend"
          for i in $(seq 1 120); do
            all_ok=1
            for c in $containers; do
              h=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c" 2>/dev/null || echo missing)
              if [ "$h" != "healthy" ]; then all_ok=0; break; fi
            done
            if [ "$all_ok" = "1" ]; then echo "All containers healthy after ~$((i * 5))s"; break; fi
            sleep 5
          done
          fail=0
          for c in $containers; do
            h=$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null || echo missing)
            echo "$c: $h"
            if [ "$h" != "healthy" ]; then docker logs "$c" --tail 30 || true; fail=1; fi
          done
          [ "$fail" -eq 0 ]

      - name: Smoke test
        run: |
          set -e
          curl -fsS http://localhost:8080/actuator/health > /dev/null && echo "gateway OK"
          curl -fsS http://localhost:8080/api/auth/health > /dev/null && echo "auth OK"
          curl -fsS http://localhost:8080/api/users/health > /dev/null && echo "user OK"
          curl -fsS http://localhost:8080/api/doctors/health > /dev/null && echo "doctor OK"
          curl -fsS http://localhost:8080/api/queue/health > /dev/null && echo "queue OK"
          curl -fsS http://localhost:8080/api/notifications/health > /dev/null && echo "notification OK"
          curl -fsS http://localhost:3030 | grep -q 'id="root"' && echo "SPA OK"
          EMAIL="rel-${{ github.sha }}@careq.test"
          curl -fsS -X POST http://localhost:8080/api/auth/signup \
            -H 'Content-Type: application/json' \
            -d "{\"fullName\":\"Release Tester\",\"email\":\"$EMAIL\",\"password\":\"CIPass123\",\"role\":\"PATIENT\"}" \
            | grep -q '"token"' && echo "signup OK"
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"CIPass123\"}" \
            | grep -q '"token"' && echo "login OK"
          echo "── Smoke test passed ──"

  # ── Day 15 plug-in point ────────────────────────────────────────────
  # A `deploy` job belongs here, after `build-and-push` succeeds:
  #   needs: build-and-push
  #   runs-on: ubuntu-latest
  #   steps:
  #     - pull ghcr.io/<owner>/careq-<service>:${{ env.IMAGE_TAG }}
  #     - roll out on the chosen cloud platform (Render/Fly/Railway/K8s…)
