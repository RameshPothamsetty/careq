# CareQ — CI
#
# Runs on every Pull Request targeting `develop` or `main`:
#   1. backend-tests  — matrix job, one per service (failures attributed per service)
#   2. frontend-tests — install, unit tests, production build
#   3. docker-smoke   — builds every image via docker-compose, boots the full
#                       stack INSIDE the runner, waits for all health checks,
#                       then hits the gateway, every service's health endpoint,
#                       the SPA, and a real signup→login flow. This is the
#                       pipeline's health check until the live deployment exists.
name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: build + test every service in a matrix ────────────────
  backend-tests:
    name: Backend · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - auth-service
          - user-service
          - doctor-service
          - queue-service
          - notification-service
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B --no-transfer-progress -f backend/pom.xml -pl ${{ matrix.service }} -am test

  # ── Frontend: install, test, build ─────────────────────────────────
  frontend-tests:
    name: Frontend · typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # ── Smoke: build all images, boot the stack, verify it works ───────
  # Self-contained on ONE runner (matrix runners don't share Docker daemons):
  # `docker compose build` produces the exact `careq-<service>` image names
  # the compose file expects, so `docker compose up -d` reuses them.
  docker-smoke:
    name: Docker · full-stack health check
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build all images
        run: docker compose build

      - name: Start the full stack
        run: docker compose up -d

      - name: Wait for every container to be healthy
        run: |
          set -e
          containers="careq-eureka careq-gateway careq-auth careq-user careq-doctor careq-queue careq-notification careq-frontend"
          for i in $(seq 1 120); do  # up to ~10 min: cold runner pulls mysql/redis/rabbitmq first
            all_ok=1
            for c in $containers; do
              h=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c" 2>/dev/null || echo missing)
              if [ "$h" != "healthy" ]; then all_ok=0; break; fi
            done
            if [ "$all_ok" = "1" ]; then echo "All containers healthy after ~$((i * 5))s"; break; fi
            sleep 5
          done
          # Final report + hard fail on anything unhealthy (logs help debugging)
          fail=0
          for c in $containers; do
            h=$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null || echo missing)
            echo "$c: $h"
            if [ "$h" != "healthy" ]; then docker logs "$c" --tail 30 || true; fail=1; fi
          done
          [ "$fail" -eq 0 ]

      - name: Smoke test (gateway + services + SPA + auth flow)
        run: |
          set -e
          echo "── Gateway health ──"
          curl -fsS http://localhost:8080/actuator/health
          echo
          echo "── Per-service health through the gateway (all whitelisted) ──"
          curl -fsS http://localhost:8080/api/auth/health > /dev/null && echo "auth OK"
          curl -fsS http://localhost:8080/api/users/health > /dev/null && echo "user OK"
          curl -fsS http://localhost:8080/api/doctors/health > /dev/null && echo "doctor OK"
          curl -fsS http://localhost:8080/api/queue/health > /dev/null && echo "queue OK"
          curl -fsS http://localhost:8080/api/notifications/health > /dev/null && echo "notification OK"
          echo "── Frontend SPA ──"
          curl -fsS http://localhost:3030 | grep -q 'id="root"' && echo "SPA OK"
          echo "── Real auth flow (signup → login → JWT) ──"
          EMAIL="ci-${{ github.sha }}@careq.test"
          curl -fsS -X POST http://localhost:8080/api/auth/signup \
            -H 'Content-Type: application/json' \
            -d "{\"fullName\":\"CI Tester\",\"email\":\"$EMAIL\",\"password\":\"CIPass123\",\"role\":\"PATIENT\"}" \
            | grep -q '"token"' && echo "signup OK"
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"CIPass123\"}" \
            | grep -q '"token"' && echo "login OK"
          echo "── Smoke test passed ──"
