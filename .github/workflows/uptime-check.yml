name: uptime-check

# Day 17 — free-tier monitoring: every 15 minutes, ping the live gateway +
# frontend. On failure, scripts/uptime-check.mjs opens a GitHub issue
# ("⚠️ CareQ uptime") which lands in your GitHub notifications; it closes
# itself when the next check passes. See docs/12_MONITORING.md.
on:
  schedule:
    # every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run uptime check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GATEWAY_URL: https://careq-api-gateway.salmonforest-402be170.southindia.azurecontainerapps.io
          FRONTEND_URL: https://careq-frontend-eta.vercel.app
        run: node scripts/uptime-check.mjs
